name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU torch + package extras)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,tuning,xai,viz]"
      - name: Ruff lint
        run: ruff check src scripts tests
      - name: Folderinfo lint
        run: bash scripts/folderinfo.sh
      - name: Unit tests (no dataset downloads, CPU)
        run: pytest -q
